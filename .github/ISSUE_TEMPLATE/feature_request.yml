name: Feature request
description: Suggest an improvement to the core template
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Which agent, skill, rule, or script would change?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Where does it belong
      options: [Core (stack-agnostic), Existing pack, New pack, Docs, Not sure]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false